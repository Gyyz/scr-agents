[project]
name = "scr-agents"
version = "0.1.0"
description = "Sovereign agentic secure code review: a self-hosted multi-agent code reviewer"
readme = "README.md"
authors = [
    { name = "Yuze GAO" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
]

# `uv sync` installs the agents through the "full" group
[project.optional-dependencies]
agents = [
    # scr_agents: review agents, web console, CLI
    "anyio>=4",
    "mlflow>=3.16.0",
    "openai>=3.8.0",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "starlette>=0.40",
    "uvicorn>=0.30",
]
# Extra static scanners scr_agents runs on the code under review when installed
scanners = [
    "bandit>=1.7",
    "ruff>=0.16.5",
]
# Online Anthropic API, used only with `llm.mode: anthropic`, an explicit opt-in.
# Not part of "full": the default install never needs an online model.
# The OpenAI API (`llm.mode: openai`) needs no extra package
anthropic = [
    "anthropic>=0.80",
]

[project.scripts]
scr-agents = "scr_agents.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["scr_agents"]

[dependency-groups]
# Installed by default (see tool.uv below), so `uv sync` gives the full reviewer
full = ["scr-agents[agents]"]
dev = [
    "httpx>=0.27",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.1",
]

[tool.uv]
default-groups = ["full", "dev"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "D",   # pydocstyle (enforce docstrings)
]
ignore = [
    "D100", # missing module docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src", "examples"]

# The Anthropic SDK is the opt-in "anthropic" extra, not installed by default;
# scr_agents imports it lazily, only for llm.mode: anthropic
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Without this pytest also walks src/ and mistakes modules such as
# scr_agents/ws3_harness/test_bench.py for tests
testpaths = ["tests"]
